server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corebank}?currentSchema=transaction
    username: ${DB_USER:corebank}
    password: ${DB_PASSWORD:corebank}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: transaction
    default-schema: transaction
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

corebank:
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
  account-call:
    connect-timeout-ms: 500
    read-timeout-ms: 2000
  recovery:
    interval-ms: 5000
    stale-seconds: 10
  chaos:
    enabled: ${CHAOS_ENABLED:false}
