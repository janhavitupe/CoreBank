name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SERVICES: customer-service account-service transaction-service notification-service ai-insights-service gateway

jobs:
  test:
    name: Compile, test and analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit and Testcontainers integration tests
        run: mvn -B verify
      - name: Report test counts
        if: always()
        run: |
          for module in */target/surefire-reports; do
            total=$(cat $module/*.txt 2>/dev/null | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' | paste -sd+ | bc)
            failed=$(cat $module/*.txt 2>/dev/null | grep -oE '(Failures|Errors): [0-9]+' | grep -oE '[0-9]+' | paste -sd+ | bc)
            echo "::notice title=Tests $(dirname $(dirname $module))::$total run, $failed failed"
          done
      - name: Static analysis (report only)
        continue-on-error: true
        run: mvn -B -DskipTests package com.github.spotbugs:spotbugs-maven-plugin:4.9.3.0:spotbugs
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: "*/target/*-1.0.0.jar"

  deploy-kind:
    name: Deploy to Kubernetes (kind) and prove the guarantees
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: jars
      - name: Build one image per service
        run: |
          for s in $SERVICES; do
            docker build --build-arg SERVICE=$s -t corebank/$s:1.0.0 .
          done
      - uses: helm/kind-action@v1
        with:
          cluster_name: corebank
      - name: Load images and apply manifests
        run: |
          for s in $SERVICES; do
            kind load docker-image corebank/$s:1.0.0 --name corebank
          done
          kubectl apply -k k8s/overlays/kind
      - name: Wait for every service to become ready
        run: |
          kubectl -n corebank rollout status statefulset/postgres --timeout=180s
          kubectl -n corebank rollout status statefulset/kafka --timeout=180s
          for s in $SERVICES; do
            kubectl -n corebank rollout status deployment/$s --timeout=300s
          done
          echo "::notice title=Kubernetes::All services ready on kind"
      - name: Forward the gateway to the runner
        run: |
          nohup bash -c 'while true; do kubectl -n corebank port-forward service/gateway 8080:8080; sleep 1; done' > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8080/actuator/health/readiness && break; sleep 2; done
      - name: End-to-end guarantees
        run: bash scripts/e2e.sh
      - uses: grafana/setup-k6-action@v1
      - name: Replay 1,000 transfers with random retries
        run: k6 run -e BASE_URL=http://localhost:8080 load-tests/replay-test.js
      - name: Load test at 100 requests per second
        continue-on-error: true
        run: |
          k6 run -e BASE_URL=http://localhost:8080 -e DURATION=60s --summary-export=results.json load-tests/transfer-load.js
          code=$?
          p95=$(jq '.metrics["http_req_duration{name:transfer}"]["p(95)"]' results.json)
          failed=$(jq '.metrics["http_req_failed{name:transfer}"].value' results.json)
          rate=$(jq '.metrics.http_reqs.rate' results.json)
          echo "::notice title=Load test::p95 $p95 ms, failure rate $failed, $rate requests/s"
          exit $code
      - name: Show pods on failure
        if: failure()
        run: |
          echo "::warning title=pods::$(kubectl -n corebank get pods --no-headers | awk '{print $1, $2, $3, "restarts=" $4}' | tr '\n' '|')"
          echo "::warning title=events::$(kubectl -n corebank get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -6 | cut -c1-170 | tr '\n' '|')"
          for s in $SERVICES; do
            pod=deployment/$s
            state=$(kubectl -n corebank get pods -l app=$s -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}')
            lines=$(kubectl -n corebank logs $pod --tail=300 2>&1 | grep -E 'Started |ERROR|Caused by|APPLICATION FAILED|Exception' | tail -3 | cut -c1-260 | tr '\n' ' ')
            echo "::warning title=$s last=$state::$lines"
          done

  deploy-aks:
    name: Push to ACR and deploy to AKS
    needs: test
    # Skipped until the repository variable AKS_ENABLED is true, so the pipeline stays green with no cluster.
    if: github.ref == 'refs/heads/main' && vars.AKS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: jars
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push images to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          for s in $SERVICES; do
            image=${{ vars.ACR_NAME }}.azurecr.io/corebank/$s:${{ github.sha }}
            docker build --build-arg SERVICE=$s -t $image .
            docker push $image
          done
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER }}
      - name: Deploy
        run: |
          kubectl create namespace corebank --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n corebank create secret generic corebank-secrets \
            --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            --from-literal=ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            --from-literal=GOOGLE_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          cd k8s/overlays/aks
          for s in $SERVICES; do
            kustomize edit set image corebank/$s=${{ vars.ACR_NAME }}.azurecr.io/corebank/$s:${{ github.sha }}
          done
          kubectl apply -k .
          for s in $SERVICES; do
            kubectl -n corebank rollout status deployment/$s --timeout=300s
          done
