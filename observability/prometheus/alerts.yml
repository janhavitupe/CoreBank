groups:
  - name: corebank
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
            / sum(rate(http_server_requests_seconds_count[1m])) > 0.02
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: More than 2% of requests are failing

      - alert: ConsumerLagGrowing
        expr: max(kafka_consumer_fetch_manager_records_lag_max) > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A Kafka consumer is falling behind
